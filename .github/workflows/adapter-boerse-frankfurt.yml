name: Adapter – Börse Frankfurt

on:
  # Paused: Twelve Data free plan does not cover European exchanges.
  # Re-enable schedule once a suitable free data source is confirmed.
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci

      - name: Check TWELVEDATA_API_KEY present
        run: |
          if [ -z "$TWELVEDATA_API_KEY" ]; then
            echo "❌ Missing TWELVEDATA_API_KEY secret"
            exit 1
          else
            echo "✅ TWELVEDATA_API_KEY present"
          fi
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}

      - name: Run Börse Frankfurt adapter
        run: node adapters/_run.js boerse-frankfurt
        env:
          DISCOVERY_BACKEND_URL: ${{ secrets.DISCOVERY_BACKEND_URL }}
          DISCOVERY_SECRET: ${{ secrets.DISCOVERY_SECRET }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
