name: Analysten-Scout – Hochstufungen sammeln und bewerten

on:
  # Der Feed liefert nur die neuesten 200 Meldungen (TradingView ≈ 7 Stunden), deshalb alle zwei
  # Stunden über den Handelstag. Samstag und Sonntag je ein Lauf. 21:17 läuft vor der Auto-Rotation (21:37).
  schedule:
    - cron: '17 7,9,11,13,15,17,19,21,23 * * 1-5'
    - cron: '17 12 * * 0,6'
  push:
    branches: [main]
    paths: ['tools/upgrade-scout/**', 'ui/lib/upgrade-scout.js']
  workflow_dispatch:
    inputs:
      dry:
        description: 'Probelauf erzwingen (nichts in die Inbox, nur Bericht)'
        type: boolean
        default: true
      set_mode:
        description: 'Nur Modus umschalten (kein Lauf): live = Inbox, dry = nur Bericht'
        type: choice
        options: ['', 'live', 'dry']
        default: ''

concurrency:
  group: upgrade-scout
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tools/upgrade-scout/run.mjs
        env:
          DISCOVERY_BACKEND_URL: ${{ secrets.DISCOVERY_BACKEND_URL }}
          DISCOVERY_SECRET: ${{ secrets.DISCOVERY_SECRET }}
          FORCE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.dry && 'dry' || '' }}
          SET_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.set_mode || '' }}
