name: Probe – StockTwits API shape (temporary)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Dump raw StockTwits responses
        run: node adapters/_probe-stocktwits.js
