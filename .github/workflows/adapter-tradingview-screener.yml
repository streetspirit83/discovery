name: Adapter – TradingView Screener

on:
  schedule:
    - cron: '47 15 * * 1-5'   # Weekdays ~15:47 UTC – mid-session US (11:47 ET) + EU closing
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci

      - name: Run TradingView Screener adapter
        run: node adapters/_run.js tradingview-screener
        env:
          DISCOVERY_BACKEND_URL: ${{ secrets.DISCOVERY_BACKEND_URL }}
          DISCOVERY_SECRET: ${{ secrets.DISCOVERY_SECRET }}
