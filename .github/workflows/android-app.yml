name: Android-App (APK)

# Baut ui/ mit Capacitor zu einer eigenständigen Android-App. Die App trägt die
# Oberfläche in sich (kein GitHub Pages nötig) und hat eigene Einstellungen und
# einen eigenen Cache, getrennt von der Web-App. Ergebnis: Vorab-Release
# "android-latest" mit discovery.apk (wird bei jedem Lauf ersetzt).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-app.yml'

permissions:
  contents: write

concurrency:
  group: android-app
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }

      - name: Oberfläche einpacken (ui/ → www/)
        run: |
          rm -rf www && cp -r ../ui www
          rm -f www/sw.js www/mockup.html www/STYLEGUIDE.md

      - name: Capacitor-Projekt erzeugen
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          npx capacitor-assets generate --android \
            --iconBackgroundColor '#00A8E8' --iconBackgroundColorDark '#00A8E8' \
            --splashBackgroundColor '#0b1220' --splashBackgroundColorDark '#0b1220'
          npx cap sync android

      - name: Versionsnummer setzen
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"$(date -u +%Y.%m.%d)-${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      # Updates lassen sich nur über eine App mit demselben Schlüssel installieren.
      # Fester Schlüssel: Secret ANDROID_KEYSTORE_B64 (base64 eines Debug-Keystores,
      # Alias androiddebugkey, Passwort android). Ohne Secret hält der Cache den
      # Schlüssel, solange er nicht verfällt (7 Tage ohne Lauf).
      - name: Signaturschlüssel aus dem Cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1
      - name: Signaturschlüssel bereitstellen
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            echo "$ANDROID_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "Schlüssel aus Secret"
          elif [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            echo "Schlüssel neu erzeugt"
          else
            echo "Schlüssel aus Cache"
          fi

      - name: APK bauen
        working-directory: android-app/android
        run: ./gradlew --no-daemon assembleDebug

      - name: APK ablegen
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/discovery.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: discovery-apk
          path: ${{ runner.temp }}/discovery.apk

      - name: Vorab-Release "android-latest" aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create android-latest "$RUNNER_TEMP/discovery.apk" --prerelease \
            --target "${{ github.sha }}" \
            --title "Discovery Android (Build ${{ github.run_number }})" \
            --notes "Automatischer Build aus ui/ vom $(date -u +%d.%m.%Y). APK herunterladen und installieren."
