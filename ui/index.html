<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discovery Workspace</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header class="app-header">
     
      <span id="mode-badge" class="header-badge">Laden…</span>
      <button class="btn btn-sm" id="btn-refresh" title="Aktualisieren">↺ </button>
      <button class="btn btn-sm" id="btn-upload" title="JSON hochladen">📤 </button>
      <button class="btn btn-sm" id="btn-settings" title="Einstellungen">⚙️ </button>
    </header>

    <div class="app-body">
      <main class="list-panel" id="list-panel"></main>
      <aside id="detail-panel"></aside>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
