<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discovery – UI Mockup</title>
<style>
/* ════════════════════════════════════════════════════════════════════
   DESIGN TOKENS (token-first — no hardcoded values in component CSS)
   ════════════════════════════════════════════════════════════════════ */
:root{
  /* ─ Farbe ─ */
  --bg:#f8fafc;
  --surface:#ffffff;
  --surface-2:#f1f5f9;
  --surface-3:#e2e8f0;
  --sheet-bg:#ffffff;
  --border:#cbd5e1;
  --text:#0f172a;
  --muted:#475569;
  --accent:#2563eb;
  --accent-weak:#e3edfd;
  --pos:#15803d;       --pos-weak:#dcfce7;
  --neg:#b91c1c;       --neg-weak:#fee2e2;
  --warn:#b45309;
  --ai:#7c3aed;        --ai-weak:#ede9fe;
  --scrim:rgba(0,23,31,0.32);

  /* ─ Spacing ─ */
  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:24px;

  /* ─ Radii ─ */
  --r-1:4px; --r-2:8px; --r-pill:999px;

  /* ─ Typografie ─ */
  --font-ui:-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --font-mono:ui-monospace, 'SF Mono', 'Cascadia Code', 'Roboto Mono', Menlo, Consolas, monospace;
  --fs-1:11px; --fs-2:12px; --fs-3:13px; --fs-4:14px; --fs-5:16px; --fs-6:18px;
  --fw-reg:400; --fw-med:500; --fw-bold:700;
  --lh:1.45;

  /* ─ Bar-Höhen ─ */
  --h-topbar:52px; --h-subbar:44px; --h-filterbar:48px;
  --h-bulkbar:52px; --h-botnav:56px;

  /* ─ Motion ─ */
  --t-fast:0.12s; --t-sheet:0.2s; --ease:ease;
  --flash:1.2s;

  /* ─ Z-Index-Leiter ─ */
  --z-thead:2; --z-sticky-col:3; --z-sticky-corner:4;
  --z-bulkbar:20; --z-botnav:30; --z-topbar:30;
  --z-scrim:40; --z-sheet:50; --z-toast:60;

  /* ─ Tabelle ─ */
  --col-check-w:40px; --col-name-w:160px;
}
[data-theme="dark"]{
  --bg:#0b1220; --surface:#111827; --surface-2:#0f172a; --surface-3:#1e293b;
  --sheet-bg:#0a0f1a;
  --border:#334155; --text:#e2e8f0; --muted:#94a3b8;
  --accent:#3b82f6; --accent-weak:#16243f;
  --pos:#4ade80; --pos-weak:#0f2a1a; --neg:#f87171; --neg-weak:#3a1414;
  --warn:#fbbf24; --ai:#a78bfa; --ai-weak:#241a3d;
  --scrim:rgba(0,0,0,0.5);
}

/* ════════════════════════════════════════════════════════════════════
   RESET / BASE
   ════════════════════════════════════════════════════════════════════ */
*{ box-sizing:border-box; margin:0; padding:0; }
html,body{ height:100%; }
body{
  font-family:var(--font-ui);
  background:var(--bg);
  color:var(--text);
  font-size:var(--fs-4);
  line-height:var(--lh);
  -webkit-tap-highlight-color:transparent;
}
button{ font-family:inherit; cursor:pointer; }
svg{ display:block; }
.icon{ width:20px; height:20px; stroke-width:2; flex-shrink:0; }
.icon-sm{ width:16px; height:16px; stroke-width:2; flex-shrink:0; }

/* Focus-visible ring for ALL interactive elements */
:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:var(--r-1); }
:focus:not(:focus-visible){ outline:none; }

/* ════════════════════════════════════════════════════════════════════
   APP SHELL (CSS grid)
   ════════════════════════════════════════════════════════════════════ */
#app{
  display:grid;
  grid-template-rows:var(--h-topbar) var(--h-subbar) var(--h-filterbar) 1fr var(--h-botnav);
  height:100dvh;
}

/* ─ Topbar ─ */
.topbar{
  display:flex; align-items:center; gap:var(--s-2);
  padding:0 var(--s-4);
  background:var(--surface-2);
  border-bottom:1px solid var(--border);
  z-index:var(--z-topbar);
}
.topbar__title{ font-size:var(--fs-6); font-weight:var(--fw-bold); color:var(--accent); flex:1; }
.topbar__actions{ display:flex; align-items:center; gap:var(--s-1); }

.icon-btn{
  display:inline-flex; align-items:center; justify-content:center;
  width:44px; height:44px; border:none; background:none;
  color:var(--muted); border-radius:var(--r-1);
  transition:background var(--t-fast) var(--ease), color var(--t-fast) var(--ease);
}
.icon-btn:hover{ background:var(--surface-3); color:var(--text); }
.icon-btn:active{ opacity:0.7; }
.icon-btn:disabled{ opacity:0.4; cursor:not-allowed; }
.icon-btn--neg{ color:var(--neg); }
.spin{ animation:spin 1s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg); } }

/* ─ Subbar (segmented view toggle) ─ */
.subbar{
  display:flex; align-items:center;
  padding:0 var(--s-4);
  background:var(--surface-2);
  border-bottom:1px solid var(--border);
  overflow-x:auto; overflow-y:hidden;
}
.segmented{ display:inline-flex; gap:var(--s-1); }
.seg-btn{
  padding:var(--s-1) var(--s-3);
  border:1px solid var(--border);
  background:var(--surface-3);
  color:var(--muted);
  border-radius:var(--r-pill);
  font-size:var(--fs-3); font-weight:var(--fw-med);
  white-space:nowrap;
  transition:background var(--t-fast) var(--ease), color var(--t-fast) var(--ease);
}
.seg-btn--active{ background:var(--accent); border-color:var(--accent); color:#fff; }

/* ─ Filterbar ─ */
.filterbar{
  display:flex; align-items:center; gap:var(--s-2);
  padding:0 var(--s-4);
  background:var(--surface-2);
  border-bottom:1px solid var(--border);
  overflow-x:auto; overflow-y:hidden;
  white-space:nowrap;
}
.pill-group{ display:inline-flex; align-items:center; gap:var(--s-1); }
.pill{
  padding:var(--s-1) var(--s-3);
  border:1px solid var(--border);
  background:var(--surface-3);
  color:var(--muted);
  border-radius:var(--r-pill);
  font-size:var(--fs-2); font-weight:var(--fw-med);
  white-space:nowrap;
  transition:background var(--t-fast) var(--ease), color var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease);
}
.pill--active{ background:var(--accent-weak); border-color:var(--accent); color:var(--accent); }
.filter-sep{ width:1px; height:24px; background:var(--border); flex-shrink:0; }
.filter-select{
  height:32px; padding:0 var(--s-2);
  background:var(--surface-3); border:1px solid var(--border);
  color:var(--text); border-radius:var(--r-pill); font-size:var(--fs-2);
  font-family:var(--font-ui);
}
.filter-select--active{ background:var(--accent-weak); border-color:var(--accent); color:var(--accent); }
.pill--reset{
  display:inline-flex; align-items:center; gap:var(--s-1);
  background:var(--accent-weak); border-color:var(--accent); color:var(--accent);
}

/* ─ Content (the only scroll container) ─ */
.content{ overflow:auto; min-height:0; position:relative; background:var(--bg); }

/* ════════════════════════════════════════════════════════════════════
   TABLE
   ════════════════════════════════════════════════════════════════════ */
.candidate-table{
  width:100%;
  border-collapse:separate;   /* required for sticky borders */
  border-spacing:0;
  font-family:var(--font-mono);
  font-size:var(--fs-3);
}
.candidate-table th, .candidate-table td{
  padding:var(--s-2) var(--s-3);
  text-align:left;
  white-space:nowrap;
  box-shadow:inset 0 -1px 0 var(--border);  /* bottom border (sticky-safe) */
}
.candidate-table thead th{
  position:sticky; top:0; z-index:var(--z-thead);
  background:var(--surface-2);
  color:var(--muted);
  font-weight:var(--fw-bold);
  font-size:var(--fs-1);
  text-transform:uppercase; letter-spacing:0.4px;
}
.sort-btn{
  display:inline-flex; align-items:center; gap:var(--s-1);
  background:none; border:none; color:inherit;
  font:inherit; text-transform:inherit; letter-spacing:inherit;
  padding:var(--s-1); margin:calc(-1 * var(--s-1));
}
.sort-btn:hover{ color:var(--text); }
.sort-glyph{ color:var(--accent); font-size:var(--fs-2); }

.num{ text-align:right; font-variant-numeric:tabular-nums; }
th.num .sort-btn{ flex-direction:row-reverse; }
.pos{ color:var(--pos); }
.neg{ color:var(--neg); }

/* sticky-left columns */
.col-check{ width:var(--col-check-w); }
th.col-check, td.col-check{ position:sticky; left:0; z-index:var(--z-sticky-col); }
td.col-check{ background:var(--surface); }
th.col-check{ background:var(--surface-2); z-index:var(--z-sticky-corner); }

.col-anchor{
  position:sticky; left:var(--col-check-w); z-index:var(--z-sticky-col);
  max-width:var(--col-name-w);
}
td.col-anchor{ background:var(--surface); }
th.col-anchor{ background:var(--surface-2); z-index:var(--z-sticky-corner); }
td.col-anchor, th.col-anchor{ box-shadow:inset 0 -1px 0 var(--border), inset -1px 0 0 var(--border); }
td.col-check, th.col-check{ box-shadow:inset 0 -1px 0 var(--border); }

/* rows */
.candidate-row{ cursor:pointer; }
.candidate-row td{ background:var(--surface); height:44px; }
.candidate-row:hover td{ background:var(--surface-2); }
.candidate-row.is-active td{ background:var(--accent-weak); }
.candidate-row.is-selected td{ background:var(--accent-weak); }
.candidate-row.state-dismissed{ opacity:0.5; }
.candidate-row.state-dismissed .sym-strong{ text-decoration:line-through; }

input[type="checkbox"]{ width:18px; height:18px; accent-color:var(--accent); cursor:pointer; }

.sym-cell{ display:flex; align-items:center; gap:var(--s-1); flex-wrap:nowrap; }
.sym-strong{ font-weight:var(--fw-bold); }
.exch-tag{
  font-size:var(--fs-1); color:var(--muted);
  background:var(--surface-3); border:1px solid var(--border);
  padding:1px 5px; border-radius:var(--r-1);
}
.ai-badge{ display:inline-flex; color:var(--ai); }
.rating-badge{ font-size:var(--fs-1); font-weight:var(--fw-bold); padding:1px 5px; border-radius:var(--r-1); line-height:1.4; }
.rating-badge--strong-buy{ background:var(--pos-weak); color:var(--pos); }
.rating-badge--buy{ background:var(--pos-weak); color:var(--pos); }
.rating-badge--neutral{ background:var(--surface-3); color:var(--muted); }
.rating-badge--sell{ background:var(--neg-weak); color:var(--neg); }
.rating-badge--strong-sell{ background:var(--neg-weak); color:var(--neg); }

.state-cell{ display:inline-flex; align-items:center; gap:var(--s-1); }
.state-dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }
.state-dot--new{ background:var(--accent); box-shadow:0 0 6px var(--accent); }
.state-dot--reviewed{ background:var(--muted); }
.state-dot--promoted{ background:var(--pos); box-shadow:0 0 6px var(--pos); }
.state-dot--dismissed{ background:var(--neg); }
.state-dot--imported{ background:var(--ai); box-shadow:0 0 6px var(--ai); }
.state-letter{ font-size:var(--fs-1); font-weight:var(--fw-bold); color:var(--muted); }

.name-cell{ overflow:hidden; text-overflow:ellipsis; max-width:var(--col-name-w); display:inline-block; vertical-align:middle; }

.link-cluster{ display:flex; align-items:center; gap:var(--s-1); }
.link-chip{
  display:inline-flex; align-items:center; justify-content:center;
  width:28px; height:28px; border-radius:6px;
  border:1px solid var(--border); background:var(--surface-3);
  color:var(--muted); text-decoration:none;
  transition:background var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease);
}
.link-chip img{ width:14px; height:14px; border-radius:3px; object-fit:cover; pointer-events:none; }
.link-chip:hover{ border-color:var(--accent); }
.link-chip--missing{ opacity:0.25; pointer-events:none; }

.signal-text{ font-size:var(--fs-2); color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:240px; display:inline-block; vertical-align:middle; }
.time-chip{ font-size:var(--fs-2); color:var(--muted); }

.src-badge{ display:inline-block; padding:2px 7px; border-radius:var(--r-pill); font-size:var(--fs-1); font-weight:var(--fw-bold); }

.row-actions{ display:inline-flex; gap:var(--s-1); justify-content:flex-end; }
.act-btn{
  display:inline-flex; align-items:center; justify-content:center;
  width:32px; height:32px; border:none; background:none; border-radius:var(--r-1);
  transition:background var(--t-fast) var(--ease);
}
.act-btn--promote{ color:var(--pos); }
.act-btn--promote:hover{ background:var(--pos-weak); }
.act-btn--dismiss{ color:var(--neg); }
.act-btn--dismiss:hover{ background:var(--neg-weak); }

@keyframes data-flash{ from{ background:var(--accent-weak); } to{ background:transparent; } }
.cell--updated{ animation:data-flash var(--flash) var(--ease); }

.empty-state{ text-align:center; padding:60px var(--s-4); color:var(--muted); }
.empty-state a{ color:var(--accent); cursor:pointer; text-decoration:underline; }

/* ════════════════════════════════════════════════════════════════════
   BULKBAR
   ════════════════════════════════════════════════════════════════════ */
.bulkbar{
  position:sticky; bottom:0; z-index:var(--z-bulkbar);
  display:flex; align-items:center; gap:var(--s-2);
  height:var(--h-bulkbar); padding:0 var(--s-4);
  background:var(--surface-2); border-top:1px solid var(--accent);
  transform:translateY(100%);
  transition:transform var(--t-sheet) var(--ease);
}
.bulkbar.is-open{ transform:translateY(0); }
.bulk-count{ color:var(--accent); font-weight:var(--fw-bold); font-size:var(--fs-3); white-space:nowrap; }
.bulk-actions{ display:flex; align-items:center; gap:var(--s-1); margin-left:auto; overflow-x:auto; }
.bulk-btn{
  display:inline-flex; align-items:center; gap:var(--s-1);
  height:36px; padding:0 var(--s-3); border-radius:var(--r-1);
  border:1px solid var(--border); background:var(--surface-3);
  color:var(--text); font-size:var(--fs-2); white-space:nowrap;
  transition:opacity var(--t-fast) var(--ease);
}
.bulk-btn:active{ opacity:0.7; }
.bulk-btn--neg{ background:var(--neg-weak); border-color:var(--neg); color:var(--neg); }
.bulk-btn--pos{ background:var(--pos-weak); border-color:var(--pos); color:var(--pos); }
.bulk-btn--ai{ background:var(--ai-weak); border-color:var(--ai); color:var(--ai); }
.bulk-btn--accent{ background:var(--accent-weak); border-color:var(--accent); color:var(--accent); }
.bulk-btn--neutral{ background:none; border:none; color:var(--muted); width:36px; padding:0; justify-content:center; }

/* ════════════════════════════════════════════════════════════════════
   BOTNAV
   ════════════════════════════════════════════════════════════════════ */
.botnav{ display:flex; align-items:stretch; background:var(--surface-2); border-top:1px solid var(--border); z-index:var(--z-botnav); }
.botnav__slot{
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:2px; border:none; background:none; color:var(--muted);
  font-size:var(--fs-1); min-height:44px;
  transition:color var(--t-fast) var(--ease);
}
.botnav__slot:hover{ color:var(--text); }
.botnav__slot--active{ color:var(--accent); }
.botnav__bucket-label{ font-weight:var(--fw-bold); }

/* ════════════════════════════════════════════════════════════════════
   SCRIM + SHEETS
   ════════════════════════════════════════════════════════════════════ */
.scrim{ position:fixed; inset:0; background:var(--scrim); z-index:var(--z-scrim); opacity:0; pointer-events:none; transition:opacity var(--t-fast) var(--ease); }
.scrim.is-open{ opacity:1; pointer-events:auto; }

.sheet{
  position:fixed; top:0; right:0; bottom:0; z-index:var(--z-sheet);
  width:min(320px,86vw);
  background:var(--sheet-bg); border-left:1px solid var(--border);
  transform:translateX(100%); transition:transform var(--t-sheet) var(--ease);
  display:flex; flex-direction:column; overflow-y:auto;
}
.sheet.is-open{ transform:translateX(0); }
.sheet--detail{ width:min(480px,86vw); }
@media (max-width:767px){ .sheet--detail{ width:100vw; } }

.sheet__header{
  display:flex; align-items:flex-start; justify-content:space-between;
  padding:var(--s-4); border-bottom:1px solid var(--border);
  position:sticky; top:0; background:var(--sheet-bg); z-index:1;
}
.sheet__title h2{ font-size:var(--fs-6); }
.exch-label{ font-size:var(--fs-3); color:var(--muted); font-weight:var(--fw-reg); }
.detail-name{ color:var(--muted); margin-top:var(--s-1); font-size:var(--fs-3); }
.isin{ color:var(--muted); font-size:var(--fs-1); }

.nav-item{
  display:flex; align-items:center; gap:var(--s-3);
  width:100%; min-height:48px; padding:0 var(--s-4);
  border:none; background:none; color:var(--text); font-size:var(--fs-4);
  text-align:left; border-bottom:1px solid var(--border);
}
.nav-item:hover{ background:var(--surface-2); }
.nav-item--active{ color:var(--accent); }
.nav-section-label{ padding:var(--s-3) var(--s-4) var(--s-1); font-size:var(--fs-1); text-transform:uppercase; letter-spacing:0.5px; color:var(--muted); }

.detail-state-bar{ padding:var(--s-3) var(--s-4); border-bottom:1px solid var(--border); display:flex; align-items:center; gap:var(--s-2); flex-wrap:wrap; font-size:var(--fs-3); }
.detail-section{ padding:var(--s-4); border-bottom:1px solid var(--border); }
.detail-section h3{ font-size:var(--fs-3); font-weight:var(--fw-bold); text-transform:uppercase; letter-spacing:0.4px; color:var(--muted); margin-bottom:var(--s-3); }
.btn{
  display:inline-flex; align-items:center; gap:var(--s-1);
  padding:var(--s-1) var(--s-3); min-height:36px;
  border-radius:var(--r-1); border:1px solid var(--border);
  background:var(--surface-3); color:var(--text);
  font-size:var(--fs-3); font-weight:var(--fw-med);
  transition:opacity var(--t-fast) var(--ease);
}
.btn:active{ opacity:0.7; }
.btn--pos{ background:var(--pos-weak); border-color:var(--pos); color:var(--pos); }
.btn--neg{ background:var(--neg-weak); border-color:var(--neg); color:var(--neg); }
.btn--ai{ background:var(--ai-weak); border-color:var(--ai); color:var(--ai); }
.btn--secondary{ background:var(--surface-2); color:var(--muted); }
.btn--sm{ min-height:32px; padding:var(--s-1) var(--s-2); font-size:var(--fs-2); }

.tv-grid{ display:grid; grid-template-columns:1fr 1fr; gap:var(--s-2); margin-bottom:var(--s-3); }
.tv-kv{ display:flex; flex-direction:column; gap:2px; }
.tv-kv span{ font-size:var(--fs-1); text-transform:uppercase; letter-spacing:0.5px; color:var(--muted); }
.tv-kv strong{ font-size:var(--fs-3); font-family:var(--font-mono); }
.tv-rating--strong-buy,.tv-rating--buy{ color:var(--pos); }
.tv-rating--neutral{ color:var(--muted); }
.tv-rating--sell,.tv-rating--strong-sell{ color:var(--neg); }
.tv-tints{ display:flex; flex-wrap:wrap; gap:var(--s-1); margin-bottom:var(--s-2); }
.tag{ padding:2px 8px; background:var(--accent-weak); border:1px solid var(--accent); border-radius:var(--r-pill); font-size:var(--fs-1); color:var(--accent); }
.tv-fetched{ color:var(--muted); font-size:var(--fs-1); }

.source-item{ background:var(--surface-3); border:1px solid var(--border); border-radius:var(--r-1); margin-bottom:var(--s-2); }
.source-item summary{ padding:var(--s-2) var(--s-3); cursor:pointer; display:flex; align-items:center; gap:var(--s-2); font-size:var(--fs-3); list-style:none; }
.source-item summary::-webkit-details-marker{ display:none; }
.source-adapter{ font-weight:var(--fw-bold); color:var(--accent); }
.source-signal{ color:var(--muted); font-size:var(--fs-1); }
.source-body{ padding:var(--s-3); border-top:1px solid var(--border); }
.source-snippet{ margin-bottom:var(--s-2); }
.source-body a{ color:var(--accent); font-size:var(--fs-2); }
.raw-signal{ margin-top:var(--s-2); }
.raw-signal summary{ font-size:var(--fs-1); color:var(--muted); cursor:pointer; }
.raw-signal pre{ margin-top:var(--s-2); background:var(--bg); border:1px solid var(--border); border-radius:var(--r-1); padding:var(--s-2); font-size:var(--fs-1); color:var(--muted); overflow-x:auto; white-space:pre-wrap; font-family:var(--font-mono); }

.detail-links{ display:flex; gap:var(--s-2); flex-wrap:wrap; }
.link-btn{
  display:inline-flex; align-items:center; gap:var(--s-2);
  padding:var(--s-1) var(--s-3); min-height:36px; border-radius:var(--r-1);
  text-decoration:none; font-size:var(--fs-2); font-weight:var(--fw-bold);
  border:1px solid var(--border); background:var(--accent-weak); color:var(--accent);
}

const DASH='—';
function fmtPct(v){ if(v==null) return DASH; return (v>=0?'+':'−')+Math.abs(v).toFixed(2)+'%'; }
function fmtNum(v,d=2){ if(v==null) return DASH; return Number(v).toLocaleString('de-DE',{minimumFractionDigits:d,maximumFractionDigits:d}); }
function fmtSigned(v,d=2){ if(v==null) return DASH; return (v>=0?'+':'−')+Math.abs(v).toLocaleString('de-DE',{minimumFractionDigits:d,maximumFractionDigits:d}); }
function fmtMCap(mc){ if(mc==null) return DASH; if(mc>=1e12) return (mc/1e12).toFixed(1)+'T'; if(mc>=1e9) return (mc/1e9).toFixed(1)+'B'; if(mc>=1e6) return (mc/1e6).toFixed(0)+'M'; return mc.toLocaleString(); }
function fmtDate(ts){ if(!ts) return DASH; return new Date(ts*1000).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'2-digit'}); }
function fmtDateTime(iso){ if(!iso) return ''; return new Date(iso).toLocaleString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
function posNegClass(v){ if(v==null) return ''; return v>0?'pos':v<0?'neg':''; }
function rsiClass(v){ if(v==null) return ''; if(v>=70) return 'neg'; if(v<=30) return 'pos'; return ''; }
function timeAgo(iso){ if(!iso) return DASH; const m=Math.floor((Date.now()-new Date(iso).getTime())/60000); if(m<60) return m+'m'; const h=Math.floor(m/60); if(h<24) return h+'h'; return Math.floor(h/24)+'d'; }
function ratingClass(r){ if(r==null) return 'neutral'; if(r>0.5) return 'strong-buy'; if(r>0.1) return 'buy'; if(r<-0.5) return 'strong-sell'; if(r<-0.1) return 'sell'; return 'neutral'; }
function ratingGlyph(r){ if(r==null) return '?'; if(r>0.5) return '↑↑'; if(r>0.1) return '↑'; if(r<-0.5) return '↓↓'; if(r<-0.1) return '↓'; return '→'; }
function ratingFull(r){ if(r==null) return DASH; if(r>0.5) return 'Strong Buy ↑↑'; if(r>0.1) return 'Buy ↑'; if(r<-0.5) return 'Strong Sell ↓↓'; if(r<-0.1) return 'Sell ↓'; return 'Neutral →'; }

const TEXT_COLS=new Set(['symbol','name']);
function sortValue(c,col){
  const tv=c.tv_data;
  switch(col){
    case 'symbol': return c.symbol.toLowerCase();
    case 'name': return (c.name||'').toLowerCase();
    case 'discovered': return new Date(c.first_discovered_at).getTime();
    case 'state': return STATE_ORDER.indexOf(c.workspace_state);
    case 'sources': return c.sources.length;
    case 'tv_chg1w': return tv?.change_1w ?? -Infinity;
    case 'tv_chg1m': return tv?.change_1m ?? -Infinity;
    case 'tv_h1m': return tv?.high_1m ?? -Infinity;
    case 'tv_l1m': return tv?.low_1m ?? -Infinity;
    case 'tv_h52hi': return tv?.price_52_week_high ?? -Infinity;
    case 'tv_h52lo': return tv?.price_52_week_low ?? -Infinity;
    case 'tv_hall': return tv?.high_all ?? -Infinity;
    case 'tv_lall': return tv?.low_all ?? -Infinity;
    case 'tv_perfall': return tv?.perf_all ?? -Infinity;
    case 'tv_aroondn120': return tv?.aroon_down_120 ?? -Infinity;
    case 'tv_aroondn1m': return tv?.aroon_down_1m ?? -Infinity;
    case 'tv_aroonup120': return tv?.aroon_up_120 ?? -Infinity;
    case 'tv_aroonup1m': return tv?.aroon_up_1m ?? -Infinity;
    case 'tv_macdsig': return tv?.macd_signal ?? -Infinity;
    case 'tv_rsi': return tv?.rsi ?? -Infinity;
    case 'tv_ema20': return tv?.ema20 ?? -Infinity;
    case 'tv_ema50': return tv?.ema50 ?? -Infinity;
    case 'tv_ema200': return tv?.ema200 ?? -Infinity;
    case 'tv_macd': return tv?.macd ?? -Infinity;
    case 'tv_adx': return tv?.adx ?? -Infinity;
    case 'tv_cci': return tv?.cci20_1m ?? -Infinity;
    case 'tv_donchlo': return tv?.donch_ch20_lower_1m ?? -Infinity;
    case 'tv_donchhi': return tv?.donch_ch20_upper_1m ?? -Infinity;
    case 'tv_pe': return tv?.pe_ttm ?? -Infinity;
    case 'tv_div': return tv?.dividend_yield ?? -Infinity;
    case 'tv_eps': return tv?.basic_eps_net_income ?? -Infinity;
    case 'tv_earnings': return tv?.earnings_next_date ?? -Infinity;
    case 'tv_ebitdagrowth': return tv?.ebitda_yoy_growth_fy ?? -Infinity;
    case 'tv_ebitda': return tv?.ebitda ?? -Infinity;
    case 'tv_grossmargin': return tv?.gross_margin ?? -Infinity;
    case 'tv_grossgrowth': return tv?.gross_profit_yoy_growth_fy ?? -Infinity;
    case 'tv_mom1m': return tv?.mom_1m ?? -Infinity;
    case 'tv_vol': return tv?.volatility ?? -Infinity;
    case 'tv_beta': return tv?.beta ?? -Infinity;
    case 'tv_beta3y': return tv?.beta_3_year ?? -Infinity;
    case 'tv_vol10d': return tv?.avg_vol_10d ?? -Infinity;
    case 'tv_vol30d': return tv?.average_volume_30d_calc ?? -Infinity;
    case 'tv_rating1m': return tv?.recommend_all_1m ?? -Infinity;
    case 'tv_mcap': return tv?.market_cap ?? -Infinity;
    default: return '';
  }
}

/* ════════════════════════════════════════════════════════════════════
   FILTER / SORT PIPELINE
   ════════════════════════════════════════════════════════════════════ */
function capSize(mc){ if(mc==null) return null; if(mc<300e6) return 'micro'; if(mc<2e9) return 'small'; if(mc<50e9) return 'mid'; return 'large'; }
function activeFilterCount(){ return [ui.fState, ui.fCap, ui.fSector].filter(Boolean).length; }
function getRows(){
  let rows=MOCK.filter(c=>c.bucket===ui.bucket);
  rows=rows.filter(c=>{
    if(ui.fState && c.workspace_state!==ui.fState) return false;
    if(ui.fCap && capSize(c.tv_data?.market_cap)!==ui.fCap) return false;
    if(ui.fSector && c.sector!==ui.fSector) return false;
    return true;
  });
  return rows.sort((a,b)=>{ const va=sortValue(a,ui.sortCol), vb=sortValue(b,ui.sortCol); if(va<vb) return ui.sortDir==='asc'?-1:1; if(va>vb) return ui.sortDir==='asc'?1:-1; return 0; });
}

/* ════════════════════════════════════════════════════════════════════
   RENDER: TOPBAR / SUBBAR / FILTERBAR / BOTNAV
   ════════════════════════════════════════════════════════════════════ */
function renderTopbar(){
  document.getElementById('tb-cloud').innerHTML=lucide('Cloud');
  document.getElementById('tb-import').innerHTML=lucide('Upload');
  document.getElementById('tb-theme').innerHTML=lucide(ui.theme==='dark'?'Sun':'Moon');
  document.getElementById('tb-export').innerHTML=lucide('Download');
  document.getElementById('tb-menu').innerHTML=lucide('Menu');
}
function renderSubbar(){
  const views=[['standard','Standard'],['technicals','Technicals'],['fundamentals','Fundamentals']];
  document.getElementById('view-switch').innerHTML=views.map(([v,l])=>
    `<button class="seg-btn ${ui.view===v?'seg-btn--active':''}" role="tab" aria-selected="${ui.view===v}" data-view="${v}">${l}</button>`
  ).join('');
  document.querySelectorAll('#view-switch .seg-btn').forEach(b=>b.addEventListener('click',()=>{
    ui.view=b.dataset.view;
    ui.sortCol = ui.view==='standard'?'discovered':'tv_mcap';
    ui.sortDir='desc'; saveUI(); renderSubbar(); renderTable();
  }));
}
function renderFilterbar(){
  const sectors=[...new Set(MOCK.map(c=>c.sector).filter(Boolean))].sort();
  const states=[['new','Neu'],['reviewed','Gesehen'],['promoted','Promoted'],['dismissed','Abgelehnt']];
  const caps=[['micro','Micro','<300M'],['small','Small','300M–2B'],['mid','Mid','2–50B'],['large','Large','>50B']];
  const n=activeFilterCount();
  document.getElementById('filterbar').innerHTML=`
    <div class="pill-group" role="group" aria-label="Status">
      ${states.map(([v,l])=>`<button class="pill ${ui.fState===v?'pill--active':''}" data-f="state" data-v="${v}" aria-pressed="${ui.fState===v}">${l}</button>`).join('')}
    </div>
    <span class="filter-sep"></span>
    <div class="pill-group" role="group" aria-label="Marktkapitalisierung">
      ${caps.map(([v,l,t])=>`<button class="pill ${ui.fCap===v?'pill--active':''}" data-f="cap" data-v="${v}" aria-pressed="${ui.fCap===v}" title="${t}">${l}</button>`).join('')}
    </div>
    <span class="filter-sep"></span>
    <select class="filter-select ${ui.fSector?'filter-select--active':''}" id="f-sector" aria-label="Sektor">
      <option value="">Alle Sektoren</option>
      ${sectors.map(s=>`<option value="${s}" ${ui.fSector===s?'selected':''}>${s}</option>`).join('')}
    </select>
    ${n>0?`<button class="pill pill--reset" id="f-reset">${lucide('XCircle','icon-sm')} Filter (${n})</button>`:''}
  `;
  document.querySelectorAll('#filterbar .pill[data-f]').forEach(b=>b.addEventListener('click',()=>{
    const f=b.dataset.f, v=b.dataset.v;
    if(f==='state') ui.fState = ui.fState===v?'':v;
    if(f==='cap') ui.fCap = ui.fCap===v?'':v;
    selectedIds.clear(); renderFilterbar(); renderTable();
  }));
  const sel=document.getElementById('f-sector');
  if(sel) sel.addEventListener('change',e=>{ ui.fSector=e.target.value; selectedIds.clear(); renderFilterbar(); renderTable(); });
  const reset=document.getElementById('f-reset');
  if(reset) reset.addEventListener('click',()=>{ ui.fState=ui.fCap=ui.fSector=''; selectedIds.clear(); renderFilterbar(); renderTable(); });
}
function renderBotnav(){

  document.getElementById('nav-bucket-icon').innerHTML=lucide('Layers');
  const labels={ inbox:'Inbox', archive:'Archiv', export:'Export' };

}

/* ════════════════════════════════════════════════════════════════════
   RENDER: TABLE
   ════════════════════════════════════════════════════════════════════ */
function sortGlyph(col){ return ui.sortCol===col?`<span class="sort-glyph" aria-hidden="true">${ui.sortDir==='asc'?'▲':'▼'}</span>`:''; }
function ariaSort(col){ return ui.sortCol===col?(ui.sortDir==='asc'?'ascending':'descending'):'none'; }

function renderTable(){
  const thead=document.getElementById('thead');
  const tbody=document.getElementById('tbody');
  const empty=document.getElementById('empty');

  /* THEAD */
  let cols='';
  cols += `<th class="col-check"><input type="checkbox" id="select-all" aria-label="Alle auswählen"></th>`;
  cols += `<th class="col-state" aria-sort="${ariaSort('state')}"><button class="sort-btn" data-sort="state" title="Workspace-Status">S ${sortGlyph('state')}</button></th>`;
  cols += `<th class="col-anchor" aria-sort="${ariaSort('symbol')}"><button class="sort-btn" data-sort="symbol">Symbol ${sortGlyph('symbol')}</button></th>`;
  if(ui.view==='standard'){
    cols += `<th class="col-name-data" aria-sort="${ariaSort('name')}"><button class="sort-btn" data-sort="name">Name ${sortGlyph('name')}</button></th>`;
    cols += `<th>Links</th>`;
    cols += `<th>Letztes Signal</th>`;
    cols += `<th aria-sort="${ariaSort('discovered')}"><button class="sort-btn" data-sort="discovered">Entdeckt ${sortGlyph('discovered')}</button></th>`;
    cols += `<th class="num">Aktion</th>`;
    cols += `<th aria-sort="${ariaSort('sources')}"><button class="sort-btn" data-sort="sources">Quellen ${sortGlyph('sources')}</button></th>`;
  } else {
    cols += VIEWS[ui.view].map(d=>
      `<th class="${d.num?'num':''}" aria-sort="${ariaSort(d.key)}" title="${d.title}"><button class="sort-btn" data-sort="${d.key}">${d.label} ${sortGlyph(d.key)}</button></th>`
    ).join('');
    cols += `<th class="num">Aktion</th>`;
  }
  thead.innerHTML=`<tr>${cols}</tr>`;
  thead.querySelectorAll('.sort-btn[data-sort]').forEach(btn=>btn.addEventListener('click',e=>{
    e.stopPropagation();
    const col=btn.dataset.sort;
    if(ui.sortCol===col){ ui.sortDir=ui.sortDir==='asc'?'desc':'asc'; }
    else { ui.sortCol=col; ui.sortDir=TEXT_COLS.has(col)?'asc':'desc'; }
    saveUI(); renderTable();
  }));

  /* TBODY */
  const rows=getRows();
  if(rows.length===0){
    tbody.innerHTML='';
    empty.style.display='block'; empty.className='empty-state';
    const msg = activeFilterCount()>0 ? 'Keine Treffer für die aktiven Filter.' : 'Keine Kandidaten in diesem Bucket.';
    const reset = activeFilterCount()>0 ? ` <a id="empty-reset">Filter zurücksetzen</a>` : '';
    empty.innerHTML=`<p>${msg}${reset}</p>`;
    const er=document.getElementById('empty-reset');
    if(er) er.addEventListener('click',()=>{ ui.fState=ui.fCap=ui.fSector=''; renderFilterbar(); renderTable(); });
    updateBulk(); return;
  }
  empty.style.display='none';

  tbody.innerHTML=rows.map(c=>{
    const tv=c.tv_data, links=c.links||{};
    const checked=selectedIds.has(c.id);
    const symHtml=`<div class="sym-cell">
      <span class="sym-strong">${c.symbol}</span>
      <span class="exch-tag">${c.exchange}</span>
      ${c.enrichment?`<span class="ai-badge" title="AI Enrichment">${lucide('Sparkles','icon-sm')}</span>`:''}
      ${tv?`<span class="rating-badge rating-badge--${ratingClass(tv.rating)}" title="TV Rating ${tv.rating?.toFixed(2)??'?'}">${ratingGlyph(tv.rating)}</span>`:''}
    </div>`;
    const actHtml=`<td class="num"><div class="row-actions">
      ${!['promoted','imported'].includes(c.workspace_state)?`<button class="act-btn act-btn--promote" data-act="promote" data-id="${c.id}" aria-label="Promoten">${lucide('Check','icon-sm')}</button>`:''}
      ${c.workspace_state!=='dismissed'?`<button class="act-btn act-btn--dismiss" data-act="dismiss" data-id="${c.id}" aria-label="Ablehnen">${lucide('X','icon-sm')}</button>`:''}
    </div></td>`;

    let dataCols;
    if(ui.view==='standard'){
      dataCols =
        cell('col-name-data', `<span class="name-cell" title="${c.name}">${c.name}</span>`)
        + cell('', `<div class="link-cluster">${chip(links.tradingview,TV_LOGO,'TradingView')}${chip(links.stocktwits,ST_LOGO,'StockTwits')}${chip(links.yahoo,YH_LOGO,'Yahoo Finance')}</div>`)
        + cell('', `<span class="signal-text">${c.sources[c.sources.length-1]?.info_snippet??''}</span>`)
        + cell('', `<span class="time-chip" title="${c.first_discovered_at}">${timeAgo(c.first_discovered_at)}</span>`)
        + actHtml
        + cell('', srcBadges(c.sources));
    } else {
      dataCols = VIEWS[ui.view].map(d=>cell(d.num?'num':'', d.fmt(c))).join('') + actHtml;
    }

    return `<tr class="candidate-row state-${c.workspace_state} ${c.id===activeId?'is-active':''} ${checked?'is-selected':''}"
        data-id="${c.id}" tabindex="0" role="button" aria-expanded="${c.id===activeId}"
        aria-label="${c.symbol} ${c.name}, ${STATE_LABELS[c.workspace_state]}">
      <td class="col-check"><input type="checkbox" class="row-check" data-id="${c.id}" ${checked?'checked':''} aria-label="${c.symbol} auswählen"></td>
      <td class="col-state"><span class="state-cell" aria-label="${STATE_LABELS[c.workspace_state]}">
        <span class="state-dot state-dot--${c.workspace_state}"></span>
        <span class="state-letter">${STATE_LETTER[c.workspace_state]}</span>
      </span></td>
      <td class="col-anchor">${symHtml}</td>
      ${dataCols}
    </tr>`;
  }).join('');

  /* row interactions */
  tbody.querySelectorAll('.candidate-row').forEach(tr=>{
    const open=()=>{ lastTrigger=tr; openDetail(tr.dataset.id); };
    tr.addEventListener('click',e=>{ if(e.target.closest('button,a,input')) return; open(); });
    tr.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); open(); } });
  });
  tbody.querySelectorAll('.row-check').forEach(cb=>cb.addEventListener('change',e=>{
    const id=e.target.dataset.id;
    if(e.target.checked) selectedIds.add(id); else selectedIds.delete(id);
    e.target.closest('tr').classList.toggle('is-selected',e.target.checked);
    updateBulk(); syncSelectAll();
  }));
  tbody.querySelectorAll('[data-act="promote"]').forEach(b=>b.addEventListener('click',e=>{ e.stopPropagation(); const c=MOCK.find(x=>x.id===b.dataset.id); c.workspace_state='promoted'; renderTable(); if(activeId===c.id) renderDetail(c); }));
  tbody.querySelectorAll('[data-act="dismiss"]').forEach(b=>b.addEventListener('click',e=>{ e.stopPropagation(); const c=MOCK.find(x=>x.id===b.dataset.id); c.workspace_state='dismissed'; renderTable(); if(activeId===c.id) renderDetail(c); }));

  const sa=document.getElementById('select-all');
  sa.addEventListener('change',e=>{
    const rs=getRows();
    if(e.target.checked) rs.forEach(c=>selectedIds.add(c.id)); else selectedIds.clear();
    renderTable(); updateBulk();
  });
  syncSelectAll();
  updateBulk();
}

function chip(href,logo,label){
  if(href) return `<a href="${href}" class="link-chip" target="_blank" rel="noopener" title="${label}" aria-label="${label}"><img src="${logo}" alt=""></a>`;
  return `<span class="link-chip link-chip--missing" aria-hidden="true"><img src="${logo}" alt=""></span>`;
}
function syncSelectAll(){
  const sa=document.getElementById('select-all'); if(!sa) return;
  const rows=getRows(); const sel=rows.filter(c=>selectedIds.has(c.id)).length;
  sa.checked = rows.length>0 && sel===rows.length;
  sa.indeterminate = sel>0 && sel<rows.length;
}

function renderBulkActions(){
  document.getElementById('bulk-actions').innerHTML=`
    <button class="bulk-btn bulk-btn--neg" data-bulk="dismiss">${lucide('X','icon-sm')} Ablehnen</button>
    <button class="bulk-btn bulk-btn--pos" data-bulk="promote">${lucide('Check','icon-sm')} Promoten</button>
    <button class="bulk-btn bulk-btn--ai" data-bulk="enrich">${lucide('Sparkles','icon-sm')} Enrich</button>
    <button class="bulk-btn bulk-btn--accent" data-bulk="tv">${lucide('BarChart3','icon-sm')} TV-Daten</button>
    <button class="bulk-btn bulk-btn--neg" data-bulk="delete">${lucide('Trash2','icon-sm')} Löschen</button>
    <button class="bulk-btn bulk-btn--neutral" data-bulk="clear" aria-label="Auswahl leeren">${lucide('XCircle','icon-sm')}</button>`;
  document.querySelectorAll('#bulk-actions [data-bulk]').forEach(b=>b.addEventListener('click',()=>{

function updateBulk(){
  const bar=document.getElementById('bulkbar');
  document.getElementById('bulk-count').textContent=`${selectedIds.size} ausgewählt`;
  bar.classList.toggle('is-open', selectedIds.size>0);
}

/* ════════════════════════════════════════════════════════════════════
   SHEETS: scrim, focus trap, open/close
   ════════════════════════════════════════════════════════════════════ */
const scrim=document.getElementById('scrim');
let openSheetEl=null;
function trapFocus(el,e){
  const f=el.querySelectorAll('button,a,input,textarea,select,[tabindex]:not([tabindex="-1"])');
  if(!f.length) return; const first=f[0], last=f[f.length-1];
  if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
}
function openSheet(el){
  openSheetEl=el; scrim.classList.add('is-open'); el.classList.add('is-open');
  const f=el.querySelector('button,a,input,textarea,select'); if(f) f.focus();
}
function closeSheet(){
  if(!openSheetEl) return;
  openSheetEl.classList.remove('is-open');
  document.getElementById('bucket-sheet').classList.remove('is-open');
  scrim.classList.remove('is-open');
  if(activeId){ activeId=null; renderTable(); }
  if(lastTrigger){ lastTrigger.focus?.(); lastTrigger=null; }
  openSheetEl=null;
}
scrim.addEventListener('click',closeSheet);
document.addEventListener('keydown',e=>{
  if(e.key==='Escape') closeSheet();
  if(e.key==='Tab' && openSheetEl) trapFocus(openSheetEl,e);
});

    <button class="nav-item">${lucide('Download')} Export</button>

    <div class="nav-section-label">Einstellungen</div>

/* DETAIL SHEET */
function openDetail(id){ activeId=id; renderTable(); renderDetail(MOCK.find(x=>x.id===id)); openSheet(document.getElementById('detail-sheet')); }
function renderDetail(c){
  const tv=c.tv_data, links=c.links||{};
  const tvBlock = tv?`
    <div class="detail-section">
      <h3>TV Daten</h3>
      ${tv.description?`<p style="margin-bottom:8px;font-size:var(--fs-3)">${tv.description}</p>`:''}
      ${c.sub_sector?`<p style="margin-bottom:12px;font-size:var(--fs-2);color:var(--muted)">${c.sub_sector}${c.sector?' · '+c.sector:''}</p>`:''}
      <div class="tv-grid">
        <div class="tv-kv"><span>Rating</span><strong class="tv-rating--${ratingClass(tv.rating)}">${ratingFull(tv.rating)}${tv.rating!=null?` (${tv.rating.toFixed(2)})`:''}</strong></div>
        <div class="tv-kv"><span>Market Cap</span><strong>${fmtMCap(tv.market_cap)}</strong></div>
        <div class="tv-kv"><span>Kurs</span><strong>${tv.close!=null?fmtNum(tv.close):DASH}</strong></div>
        <div class="tv-kv"><span>KGV (TTM)</span><strong>${tv.pe_ttm!=null?tv.pe_ttm.toFixed(1):DASH}</strong></div>
        <div class="tv-kv"><span>Dividende</span><strong>${tv.dividend_yield!=null?tv.dividend_yield.toFixed(2)+'%':DASH}</strong></div>
        <div class="tv-kv"><span>Nächste Earnings</span><strong>${tv.earnings_next_date?fmtDate(tv.earnings_next_date):DASH}</strong></div>
        <div class="tv-kv"><span>RSI</span><strong>${tv.rsi!=null?tv.rsi.toFixed(1):DASH}</strong></div>
        <div class="tv-kv"><span>Beta</span><strong>${tv.beta!=null?tv.beta.toFixed(2):DASH}</strong></div>
      </div>
      ${c.sector?`<div class="tv-tints"><span class="tag">${c.sector}</span>${c.sub_sector?`<span class="tag">${c.sub_sector}</span>`:''}</div>`:''}
      <small class="tv-fetched">Stand: ${fmtDateTime(tv.fetched_at)}</small>
    </div>`:'';

  const enrich = c.enrichment?(()=>{ const e=c.enrichment; return `<div class="enrichment">
      <div class="enrich-meta"><span class="tag">${e.model}</span><span style="color:var(--ai);font-weight:var(--fw-bold)">${e.confidence} confidence</span><span style="color:var(--muted)">${fmtDateTime(e.enriched_at)}</span></div>
      <div class="enrich-tags">${[e.sector,e.industry,e.market_cap_bucket&&e.market_cap_bucket+' cap',e.region].filter(Boolean).map(t=>`<span class="tag">${t}</span>`).join('')}</div>
      <div class="enrich-thesis"><p><strong>These:</strong> ${e.thesis_short||''}</p>${e.thesis_long?`<details><summary>Ausführliche These</summary><div class="thesis-long">${e.thesis_long}</div></details>`:''}</div>
      ${e.risks?.length?`<div class="enrich-block"><strong>Risiken:</strong><ul>${e.risks.map(r=>`<li>${r}</li>`).join('')}</ul></div>`:''}
      ${e.catalysts?.length?`<div class="enrich-block"><strong>Katalysatoren:</strong><ul>${e.catalysts.map(r=>`<li>${r}</li>`).join('')}</ul></div>`:''}
      ${e.sentiment?`<div class="enrich-block"><strong>Sentiment:</strong> <span class="tag">${e.sentiment}</span></div>`:''}
    </div>`; })() : `<p class="no-enrichment">Noch kein Enrichment vorhanden.</p>`;

  const sources = c.sources.map((s,i)=>`<details class="source-item" ${i===0?'open':''}>
      <summary><span class="source-adapter">${s.adapter}</span><span class="source-signal">${s.signal_type}</span><span style="margin-left:auto;color:var(--muted);font-size:var(--fs-1)">${fmtDateTime(s.discovered_at)}</span></summary>
      <div class="source-body"><p class="source-snippet">${s.info_snippet||''}</p><a href="${s.source_url}" target="_blank" rel="noopener">Quelle öffnen ↗</a>
      <details class="raw-signal"><summary>Raw Signal</summary><pre>${JSON.stringify(s.raw_signal||{},null,2)}</pre></details></div></details>`).join('');

  const linkBtn=(href,logo,label)=> href
    ? `<a href="${href}" target="_blank" rel="noopener" class="link-btn"><img src="${logo}" alt=""> ${label} ↗</a>`
    : `<span class="link-btn link-btn--missing"><img src="${logo}" alt=""> ${label}</span>`;

  document.getElementById('detail-sheet').innerHTML=`
    <div class="sheet__header">
      <div class="sheet__title">
        <h2>${c.symbol} <span class="exch-label">${c.exchange}</span></h2>
        <p class="detail-name">${tv?.description??c.name}</p>
        ${c.isin?`<small class="isin">ISIN: ${c.isin}</small>`:''}
      </div>
      <button class="icon-btn" id="detail-close" aria-label="Schließen">${lucide('X')}</button>
    </div>
    <div class="detail-state-bar">
      Status: <strong>${STATE_LABELS[c.workspace_state]}</strong>
      ${!['promoted','imported'].includes(c.workspace_state)?`<button class="btn btn--sm btn--pos" id="d-promote">${lucide('Check','icon-sm')} Promoten</button>`:''}
      ${c.workspace_state!=='dismissed'?`<button class="btn btn--sm btn--neg" id="d-dismiss">${lucide('X','icon-sm')} Ablehnen</button>`:''}
      ${c.workspace_state==='new'?`<button class="btn btn--sm btn--secondary" id="d-review">${lucide('Eye','icon-sm')} Gesehen</button>`:''}
    </div>
    ${tvBlock}
    <div class="detail-section"><h3>Quellen (${c.sources.length})</h3>${sources}</div>
    <div class="detail-section"><h3>Links</h3><div class="detail-links">${linkBtn(links.tradingview,TV_LOGO,'TradingView')}${linkBtn(links.stocktwits,ST_LOGO,'StockTwits')}${linkBtn(links.yahoo,YH_LOGO,'Yahoo Finance')}</div></div>
    <div class="detail-section"><h3>Notizen</h3><textarea class="notes-editor" rows="3" placeholder="Notizen…">${c.notes||''}</textarea><button class="btn btn--sm btn--secondary">Speichern</button></div>
    <div class="detail-section"><h3>AI-Enrichment</h3>${enrich}<button class="btn btn--sm btn--ai">${lucide(c.enrichment?'RefreshCw':'Sparkles','icon-sm')} ${c.enrichment?'Neu enrichen':'AI-Enrichment ausführen'}</button></div>
  `;
  document.getElementById('detail-close').addEventListener('click',closeSheet);
  document.getElementById('d-promote')?.addEventListener('click',()=>{ c.workspace_state='promoted'; renderTable(); renderDetail(c); });
  document.getElementById('d-dismiss')?.addEventListener('click',()=>{ c.workspace_state='dismissed'; renderTable(); renderDetail(c); });
  document.getElementById('d-review')?.addEventListener('click',()=>{ c.workspace_state='reviewed'; renderTable(); renderDetail(c); });
}

/* BUCKET PICKER */
function openBucketPicker(){
  lastTrigger=document.getElementById('nav-bucket');
  const buckets=[['inbox','Inbox'],['archive','Archiv'],['export','Export']];
  const el=document.getElementById('bucket-sheet');
  el.innerHTML=`<div class="bucket-sheet__title">Bucket wählen</div>
    ${buckets.map(([v,l])=>`<button class="bucket-opt ${ui.bucket===v?'bucket-opt--active':''}" data-bucket="${v}">${lucide('Layers')} ${l}</button>`).join('')}`;
  el.querySelectorAll('[data-bucket]').forEach(b=>b.addEventListener('click',()=>{ setBucket(b.dataset.bucket); closeSheet(); }));
  openSheetEl=el; scrim.classList.add('is-open'); el.classList.add('is-open');
  const f=el.querySelector('button'); if(f) f.focus();
}

/* ════════════════════════════════════════════════════════════════════
   ACTIONS
   ════════════════════════════════════════════════════════════════════ */
function setBucket(b){ ui.bucket=b; selectedIds.clear(); saveUI(); renderBotnav(); renderFilterbar(); renderTable(); }
function toggleTheme(){ ui.theme=ui.theme==='dark'?'light':'dark'; document.documentElement.setAttribute('data-theme',ui.theme); saveUI(); renderTopbar(); if(openSheetEl===document.getElementById('nav-sheet')) openNav(); }
function simulateSync(){
  const btn=document.getElementById('tb-cloud');
  btn.innerHTML=lucide('RefreshCw'); btn.querySelector('svg').classList.add('spin');
  setTimeout(()=>{
    btn.innerHTML=lucide('Cloud');
    document.querySelectorAll('#tbody tr:first-child td').forEach(td=>{ td.classList.add('cell--updated'); setTimeout(()=>td.classList.remove('cell--updated'),1300); });
  },1100);
}

document.getElementById('nav-bucket').addEventListener('click',openBucketPicker);
