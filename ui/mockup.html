<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discovery – UI Mockup</title>
<style>
/* ── Discovery Workspace – Styles (verbatim from styles.css) ── */
:root {
  --bg: #f8fafc;
  --bg2: #f1f5f9;
  --bg3: #e2e8f0;
  --border: #cbd5e1;
  --text: #0f172a;
  --text-muted: #64748b;
  --accent: #2563eb;
  --accent2: #3b82f6;
  --success: #16a34a;
  --danger: #dc2626;
  --warning: #d97706;
  --ai: #7c3aed;
  --tv: #2962ff;
  --radius: 8px;
  --radius-sm: 4px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; min-height: 100vh; }
#app { display: flex; flex-direction: column; height: 100vh; }
.app-header { display: flex; align-items: center; gap: 12px; padding: 12px 20px; background: var(--bg2); border-bottom: 1px solid var(--border); flex-shrink: 0; }
.app-header h1 { font-size: 18px; font-weight: 700; color: var(--accent2); flex: 1; }
.header-badge { font-size: 11px; padding: 2px 8px; border-radius: 20px; background: var(--bg3); color: var(--text-muted); border: 1px solid var(--border); }
.header-badge.mock { color: var(--warning); border-color: var(--warning); }
.app-body { display: flex; flex: 1; overflow: hidden; }
.list-panel { flex: 1; overflow-y: auto; padding: 16px; }
.btn { display: inline-flex; align-items: center; gap: 4px; padding: 6px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--bg3); color: var(--text); cursor: pointer; font-size: 13px; font-weight: 500; transition: opacity 0.1s; -webkit-tap-highlight-color: transparent; }
.btn:active { opacity: 0.7; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-primary   { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-secondary { background: var(--bg2); color: var(--text-muted); }
.btn-success   { background: color-mix(in srgb, var(--success) 12%, var(--bg)); border-color: var(--success); color: var(--success); }
.btn-danger    { background: color-mix(in srgb, var(--danger)  10%, var(--bg)); border-color: var(--danger);  color: var(--danger);  }
.btn-ai        { background: color-mix(in srgb, var(--ai)      10%, var(--bg)); border-color: var(--ai);      color: var(--ai);      }
.btn-tv        { background: color-mix(in srgb, var(--tv)      10%, var(--bg)); border-color: var(--tv);      color: var(--tv);      }
.btn-sm { padding: 4px 10px; font-size: 12px; }
.btn-icon { background: none; border: none; cursor: pointer; font-size: 16px; padding: 4px 6px; border-radius: var(--radius-sm); transition: background 0.1s; -webkit-tap-highlight-color: transparent; }
.btn-icon:active { background: var(--bg3); }
.btn-icon svg { display: block; width: 15px; height: 15px; }
.btn-icon--promote { color: var(--success); }
.btn-icon--promote:hover { background: color-mix(in srgb, var(--success) 12%, var(--bg)); }
.btn-icon--dismiss { color: var(--danger); }
.btn-icon--dismiss:hover { background: color-mix(in srgb, var(--danger) 10%, var(--bg)); }
.filter-bar { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; padding: 12px; background: var(--bg2); border-radius: var(--radius); border: 1px solid var(--border); margin-bottom: 12px; }
.filter-group { display: flex; flex-direction: column; gap: 4px; }
.filter-group label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
.filter-group select { background: var(--bg3); border: 1px solid var(--border); color: var(--text); padding: 6px 10px; border-radius: var(--radius-sm); font-size: 13px; }
.blob-switch { display: flex; gap: 4px; }
.blob-btn { padding: 6px 12px; background: var(--bg3); border: 1px solid var(--border); color: var(--text-muted); border-radius: var(--radius-sm); cursor: pointer; font-size: 13px; }
.blob-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.view-switch { display: flex; gap: 4px; }
.view-btn { padding: 6px 12px; background: var(--bg3); border: 1px solid var(--border); color: var(--text-muted); border-radius: var(--radius-sm); cursor: pointer; font-size: 13px; }
.view-btn.active { background: var(--tv); border-color: var(--tv); color: #fff; }
.bulk-bar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: color-mix(in srgb, var(--accent) 10%, var(--bg)); border: 1px solid var(--accent); border-radius: var(--radius); margin-bottom: 8px; flex-wrap: wrap; }
.bulk-bar span { color: var(--accent); font-weight: 600; font-size: 13px; }
.table-wrapper { overflow-x: auto; }
.candidate-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.candidate-table th { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); color: var(--text-muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.4px; white-space: nowrap; }
.candidate-table td { padding: 10px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.candidate-row { cursor: pointer; transition: background 0.1s; }
.candidate-row:hover { background: var(--bg2); }
.candidate-row.selected { background: color-mix(in srgb, var(--accent) 8%, var(--bg)); }
.candidate-row.active-row { background: color-mix(in srgb, var(--accent) 12%, var(--bg)); }
.candidate-row.state-dismissed { opacity: 0.5; }
.candidate-row.state-dismissed .col-symbol strong { text-decoration: line-through; }
.col-check { width: 36px; }
.col-state { width: 36px; }
.col-symbol { white-space: nowrap; }
.col-name { max-width: 180px; }
.col-signal { max-width: 260px; }
.col-time { white-space: nowrap; }
.col-links { white-space: nowrap; }
.col-actions { white-space: nowrap; text-align: right; width: 60px; }
.signal-text { font-size: 12px; color: var(--text-muted); }
.badge { display: inline-block; padding: 2px 7px; border-radius: 20px; font-size: 11px; font-weight: 600; white-space: nowrap; }
.empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
.state-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.state-dot--new       { background: var(--accent2); box-shadow: 0 0 7px color-mix(in srgb, var(--accent2), transparent 50%); }
.state-dot--reviewed  { background: var(--text-muted); }
.state-dot--promoted  { background: var(--success);  box-shadow: 0 0 7px color-mix(in srgb, var(--success),  transparent 50%); }
.state-dot--dismissed { background: var(--danger); }
.state-dot--imported  { background: var(--ai);     box-shadow: 0 0 7px color-mix(in srgb, var(--ai),     transparent 50%); }
.symbol-cell { display: flex; align-items: center; gap: 5px; flex-wrap: nowrap; }
.symbol-cell strong { font-size: 14px; }
.exchange-tag { font-size: 10px; color: var(--text-muted); background: var(--bg3); border: 1px solid var(--border); padding: 1px 5px; border-radius: 4px; }
.enrich-badge { display: inline-flex; align-items: center; color: var(--ai); }
.enrich-badge svg { width: 11px; height: 11px; }
.time-chip { font-size: 12px; color: var(--text-muted); white-space: nowrap; }
.th-sort { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; user-select: none; white-space: nowrap; }
.th-sort:hover { color: var(--text); }
.sort-icon { display: inline-flex; align-items: center; opacity: 0.35; transition: opacity 0.1s; }
.sort-icon--active { opacity: 1; color: var(--accent2); }
.sort-icon svg { display: block; }
.link-cluster { display: flex; align-items: center; gap: 3px; }
.link-chip { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg3); text-decoration: none; cursor: pointer; color: var(--text-muted); transition: background 0.12s, color 0.12s, border-color 0.12s; }
.link-chip svg { width: 14px; height: 14px; display: block; }
.link-chip--missing { opacity: 0.25; cursor: default; pointer-events: none; }
.link-chip--tv:hover    { color: var(--accent2); border-color: color-mix(in srgb, var(--accent2), transparent 50%); background: color-mix(in srgb, var(--accent2) 8%, var(--bg)); }
.link-chip--st:hover    { color: var(--success);  border-color: color-mix(in srgb, var(--success), transparent 50%);  background: color-mix(in srgb, var(--success)  8%, var(--bg)); }
.link-chip--yahoo:hover { color: var(--ai);       border-color: color-mix(in srgb, var(--ai), transparent 50%);       background: color-mix(in srgb, var(--ai)       8%, var(--bg)); }
.tv-col { white-space: nowrap; }
.tv-num { text-align: right; font-variant-numeric: tabular-nums; }
.tv-pos { color: var(--success); }
.tv-neg { color: var(--danger); }
.tv-rating-badge { font-size: 10px; font-weight: 700; padding: 1px 4px; border-radius: 3px; line-height: 1.4; }
.tv-rating-badge--strong-buy  { background: #bbf7d0; color: #14532d; }
.tv-rating-badge--buy         { background: #dcfce7; color: #166534; }
.tv-rating-badge--neutral     { background: var(--bg3); color: var(--text-muted); }
.tv-rating-badge--sell        { background: #fee2e2; color: #7f1d1d; }
.tv-rating-badge--strong-sell { background: #fca5a5; color: #7f1d1d; }
.tv-rating-txt--strong-buy  { color: #16a34a; font-weight: 700; }
.tv-rating-txt--buy         { color: #22c55e; font-weight: 700; }
.tv-rating-txt--neutral     { color: var(--text-muted); }
.tv-rating-txt--sell        { color: #ef4444; font-weight: 700; }
.tv-rating-txt--strong-sell { color: #dc2626; font-weight: 700; }
.sector-tag { display: inline-block; padding: 2px 7px; background: color-mix(in srgb, var(--tv) 10%, var(--bg)); border: 1px solid color-mix(in srgb, var(--tv), transparent 65%); border-radius: 20px; font-size: 11px; color: var(--tv); white-space: nowrap; }
/* Detail drawer */
.detail-drawer { width: 0; overflow: hidden; background: var(--bg2); border-left: 1px solid var(--border); transition: width 0.25s ease; flex-shrink: 0; overflow-y: auto; }
.detail-drawer.open { width: min(480px, 100vw); }
.detail-header { display: flex; align-items: flex-start; justify-content: space-between; padding: 20px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg2); z-index: 1; }
.detail-title h2 { font-size: 20px; }
.exchange-label { font-size: 13px; color: var(--text-muted); font-weight: 400; }
.detail-name { color: var(--text-muted); margin-top: 4px; }
.isin { color: var(--text-muted); font-size: 11px; }
.detail-state { padding: 12px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.detail-section { padding: 16px 20px; border-bottom: 1px solid var(--border); }
.detail-section h3 { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; color: var(--text-muted); margin-bottom: 12px; }
.source-item { background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius-sm); margin-bottom: 8px; }
.source-item summary { padding: 10px 12px; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 13px; list-style: none; }
.source-item summary::-webkit-details-marker { display: none; }
.source-adapter { font-weight: 700; color: var(--accent2); }
.source-signal { color: var(--text-muted); font-size: 11px; }
.source-body { padding: 12px; border-top: 1px solid var(--border); }
.source-snippet { margin-bottom: 8px; color: var(--text); }
.source-body a { color: var(--accent2); font-size: 12px; }
.raw-signal { margin-top: 8px; }
.raw-signal summary { font-size: 11px; color: var(--text-muted); cursor: pointer; }
.raw-signal pre { margin-top: 8px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px; font-size: 11px; color: var(--text-muted); overflow-x: auto; white-space: pre-wrap; }
.notes-editor { width: 100%; background: var(--bg3); border: 1px solid var(--border); color: var(--text); border-radius: var(--radius-sm); padding: 10px; font-family: inherit; font-size: 13px; resize: vertical; margin-bottom: 8px; }
.no-enrichment { color: var(--text-muted); margin-bottom: 12px; font-size: 13px; }
.enrichment-result { background: color-mix(in srgb, var(--ai) 8%, var(--bg)); border: 1px solid color-mix(in srgb, var(--ai), transparent 70%); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; }
.enrichment-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.enrichment-meta small { color: var(--text-muted); font-size: 11px; }
.enrichment-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.tag { padding: 2px 8px; background: color-mix(in srgb, var(--accent) 8%, var(--bg)); border: 1px solid color-mix(in srgb, var(--accent), transparent 60%); border-radius: 20px; font-size: 11px; color: var(--accent); }
.enrichment-thesis { margin-bottom: 10px; line-height: 1.5; }
.enrichment-thesis p { margin-bottom: 8px; font-size: 13px; }
.thesis-long { margin-top: 8px; font-size: 13px; color: var(--text-muted); line-height: 1.6; }
.enrichment-section { margin-top: 10px; font-size: 13px; }
.enrichment-section ul { margin-left: 16px; margin-top: 4px; }
.enrichment-section li { margin-bottom: 4px; color: var(--text-muted); }
.enrich-status { margin-top: 8px; padding: 8px 12px; border-radius: var(--radius-sm); font-size: 13px; }
.enrich-status--info  { background: color-mix(in srgb, var(--accent) 10%, var(--bg)); color: var(--accent2); }
.enrich-status--error { background: color-mix(in srgb, var(--danger)  8%,  var(--bg)); color: var(--danger);  }
.tv-data-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
.tv-kv { display: flex; flex-direction: column; gap: 2px; }
.tv-kv span { font-size: 10px; text-transform: uppercase; letter-spacing: .5px; color: var(--text-muted); }
.tv-kv strong { font-size: 13px; }
.tv-rating--strong-buy  { color: #16a34a; }
.tv-rating--buy         { color: #22c55e; }
.tv-rating--neutral     { color: var(--text-muted); }
.tv-rating--sell        { color: #ef4444; }
.tv-rating--strong-sell { color: #dc2626; }
.tv-meta { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
.tv-fetched { color: var(--text-muted); font-size: 11px; }
.link-btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: var(--radius-sm); text-decoration: none; font-size: 12px; font-weight: 600; border: 1px solid var(--border); }
.link-btn--missing { opacity: 0.35; cursor: default; pointer-events: none; }
.link-tv    { background: color-mix(in srgb, var(--accent2) 8%, var(--bg)); color: var(--accent2); border-color: color-mix(in srgb, var(--accent2), transparent 65%); }
.link-yahoo { background: color-mix(in srgb, var(--ai)      8%, var(--bg)); color: var(--ai);      border-color: color-mix(in srgb, var(--ai),      transparent 65%); }
.link-st    { background: color-mix(in srgb, var(--success) 8%, var(--bg)); color: var(--success); border-color: color-mix(in srgb, var(--success),  transparent 65%); }
.detail-links-btns { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.link-url-fields { display: flex; flex-direction: column; gap: 0; }
.link-url-row { margin-bottom: 10px; }
.link-url-row label { display: block; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin-bottom: 3px; }
.link-url-row input { width: 100%; background: var(--bg3); border: 1px solid var(--border); color: var(--text); padding: 7px 10px; border-radius: var(--radius-sm); font-size: 12px; font-family: inherit; }
.link-url-row input:focus { outline: none; border-color: var(--accent); }
.link-btn-logo { width: 18px; height: 18px; border-radius: 3px; object-fit: cover; flex-shrink: 0; }
.link-logo { width: 16px; height: 16px; border-radius: 3px; object-fit: cover; display: block; pointer-events: none; }
.toast { position: fixed; bottom: 20px; right: 20px; background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 16px; font-size: 13px; z-index: 200; animation: slideIn 0.2s ease; max-width: 320px; }
.toast--info { border-color: var(--accent); color: var(--accent2); }
@keyframes slideIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
@media (max-width: 768px) {
  .app-header h1 { font-size: 16px; }
  .col-name, .col-signal { display: none; }
  .detail-drawer.open { width: 100vw; position: fixed; inset: 0; z-index: 50; }
  .filter-bar { gap: 8px; }
}
</style>
</head>

<div id="app">
  <header class="app-header">
    <h1>Discovery Workspace</h1>

  <div class="app-body">

</div>

// ── Helpers ───────────────────────────────────────────────────────────────────
function fmtPct(v) { if (v == null) return '—'; return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function fmtNum(v, dec = 2) { if (v == null) return '—'; return Number(v).toLocaleString('de-DE', { minimumFractionDigits: dec, maximumFractionDigits: dec }); }
function fmtMCap(mc) { if (mc == null) return '—'; if (mc >= 1e12) return `${(mc/1e12).toFixed(1)}T`; if (mc >= 1e9) return `${(mc/1e9).toFixed(1)}B`; if (mc >= 1e6) return `${(mc/1e6).toFixed(0)}M`; return mc.toLocaleString(); }
function fmtDate(ts) { if (!ts) return '—'; return new Date(ts * 1000).toLocaleDateString('de-DE', { day:'2-digit', month:'2-digit', year:'2-digit' }); }
function fmtDateTime(isoStr) { if (!isoStr) return ''; return new Date(isoStr).toLocaleString('de-DE', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' }); }
function posNeg(v) { if (v == null) return ''; return v > 0 ? ' tv-pos' : v < 0 ? ' tv-neg' : ''; }
function rsiClass(v) { if (v == null) return ''; if (v >= 70) return ' tv-neg'; if (v <= 30) return ' tv-pos'; return ''; }
function tvRatingClass(r) { if (r == null) return 'neutral'; if (r > 0.5) return 'strong-buy'; if (r > 0.1) return 'buy'; if (r < -0.5) return 'strong-sell'; if (r < -0.1) return 'sell'; return 'neutral'; }
function tvRatingLabel(r) { if (r == null) return '?'; if (r > 0.5) return '↑↑'; if (r > 0.1) return '↑'; if (r < -0.5) return '↓↓'; if (r < -0.1) return '↓'; return '→'; }
function tvRatingLabelFull(r) { if (r == null) return '—'; if (r > 0.5) return 'Strong Buy ↑↑'; if (r > 0.1) return 'Buy ↑'; if (r < -0.5) return 'Strong Sell ↓↓'; if (r < -0.1) return 'Sell ↓'; return 'Neutral →'; }
function timeAgo(isoStr) {
  if (!isoStr) return '–';
  const diff = Date.now() - new Date(isoStr).getTime();
  const mins = Math.floor(diff / 60000);
  if (mins < 60) return `${mins}m`;
  const hours = Math.floor(mins / 60);
  if (hours < 24) return `${hours}h`;
  return `${Math.floor(hours / 24)}d`;
}
function sourceBadges(sources) {
  return [...new Set(sources.map(s => s.adapter))].map(a => {
    const col = ADAPTER_COLORS[a] ?? '#888';
    return `<span class="badge" style="background:${col}18;color:${col};border:1px solid ${col}55">${a}</span>`;
  }).join(' ');
}

function getRows() {
  let rows = MOCK.filter(c => {
    if (filterState && c.workspace_state !== filterState) return false;
    if (filterSector && c.sector !== filterSector) return false;
    if (filterCapSize) {
      const mc = c.tv_data?.market_cap;
      let size = null;
      if (mc != null) { if (mc < 300e6) size = 'micro'; else if (mc < 2e9) size = 'small'; else if (mc < 50e9) size = 'mid'; else size = 'large'; }
      if (size !== filterCapSize) return false;
    }
    return true;
  });
  return rows.sort((a, b) => {
    const va = sortValue(a, sortCol), vb = sortValue(b, sortCol);
    if (va < vb) return sortDir === 'asc' ? -1 : 1;
    if (va > vb) return sortDir === 'asc' ? 1 : -1;
    return 0;
  });
}

      <th class="tv-col">${th('tv_beta')}</th>
      <th class="tv-col">${th('tv_beta3y')}</th>
      <th class="tv-col">${th('tv_vol10d')}</th>
      <th class="tv-col">${th('tv_vol30d')}</th>
      <th class="tv-col">${th('tv_rating1m')}</th>
      <th class="col-actions">Aktion</th>
    </tr>`;
  } else {
    return `<tr>
      <th class="col-check"><input type="checkbox" id="select-all"></th>
      ${stateTh}
      <th class="col-symbol">${th('symbol')}</th>
      <th class="col-name">${th('name')}</th>
      <th class="col-links">Links</th>
      <th class="col-signal">Letztes Signal</th>
      <th class="col-time">${th('discovered')}</th>
      <th class="col-actions">Aktion</th>
      <th>Quellen</th>
    </tr>`;
  }
}

function renderRows() {
  const rows = getRows();
  if (rows.length === 0) return '<tr><td colspan="20" class="empty-state">Keine Kandidaten gefunden.</td></tr>';
  return rows.map(c => {
    const tv = c.tv_data;
    const links = c.links ?? {};
    const symbolTd = `<td class="col-symbol"><div class="symbol-cell">
      <strong>${c.symbol}</strong>
      <span class="exchange-tag">${c.exchange}</span>
      ${c.enrichment ? `<span class="enrich-badge" title="AI Enrichment">${IC.sparkles}</span>` : ''}
      ${tv ? `<span class="tv-rating-badge tv-rating-badge--${tvRatingClass(tv.rating)}">${tvRatingLabel(tv.rating)}</span>` : ''}
    </div></td>`;
    const actionTd = `<td class="col-actions">
      ${!['promoted','imported'].includes(c.workspace_state) ? `<button class="btn-icon btn-icon--promote" data-action="promote" data-id="${c.id}" title="Promoten">${IC.check}</button>` : ''}
      ${c.workspace_state !== 'dismissed' ? `<button class="btn-icon btn-icon--dismiss" data-action="dismiss" data-id="${c.id}" title="Ablehnen">${IC.xMark}</button>` : ''}
    </td>`;
    let dataCols;
    if (viewMode === 'technicals') {
      dataCols = `
        <td class="tv-col tv-num${posNeg(tv?.change_1w)}">${fmtPct(tv?.change_1w)}</td>
        <td class="tv-col tv-num${posNeg(tv?.change_1m)}">${fmtPct(tv?.change_1m)}</td>
        <td class="tv-col tv-num">${fmtNum(tv?.high_1m)}</td>
        <td class="tv-col tv-num">${fmtNum(tv?.low_1m)}</td>
        <td class="tv-col tv-num">${fmtNum(tv?.price_52_week_high)}</td>
        <td class="tv-col tv-num">${fmtNum(tv?.price_52_week_low)}</td>
        <td class="tv-col tv-num">${fmtNum(tv?.high_all)}</td>
        <td class="tv-col tv-num">${fmtNum(tv?.low_all)}</td>
        <td class="tv-col tv-num${posNeg(tv?.perf_all)}">${tv?.perf_all != null ? fmtNum(tv.perf_all,1)+'%' : '—'}</td>
        <td class="tv-col tv-num">${fmtNum(tv?.aroon_down_120,1)}</td>
        <td class="tv-col tv-num">${fmtNum(tv?.aroon_down_1m,1)}</td>
        <td class="tv-col tv-num">${fmtNum(tv?.aroon_up_120,1)}</td>
        <td class="tv-col tv-num">${fmtNum(tv?.aroon_up_1m,1)}</td>
        <td class="tv-col tv-num${posNeg(tv?.macd_signal)}">${fmtNum(tv?.macd_signal,3)}</td>
        <td class="tv-col tv-num${rsiClass(tv?.rsi)}">${fmtNum(tv?.rsi,1)}</td>
        <td class="tv-col tv-num">${fmtNum(tv?.ema20)}</td>
        <td class="tv-col tv-num">${fmtNum(tv?.ema50)}</td>
        <td class="tv-col tv-num">${fmtNum(tv?.ema200)}</td>
        <td class="tv-col tv-num${posNeg(tv?.macd)}">${fmtNum(tv?.macd,3)}</td>
        <td class="tv-col tv-num">${fmtNum(tv?.adx,1)}</td>
        <td class="tv-col tv-num${posNeg(tv?.cci20_1m)}">${fmtNum(tv?.cci20_1m,1)}</td>
        <td class="tv-col tv-num">${fmtNum(tv?.donch_ch20_lower_1m)}</td>
        <td class="tv-col tv-num">${fmtNum(tv?.donch_ch20_upper_1m)}</td>

    } else if (viewMode === 'fundamentals') {
      dataCols = `
        <td class="tv-col tv-num">${fmtNum(tv?.pe_ttm,1)}</td>
        <td class="tv-col tv-num${posNeg(tv?.dividend_yield)}">${tv?.dividend_yield != null ? fmtNum(tv.dividend_yield,2)+'%' : '—'}</td>
        <td class="tv-col tv-num${posNeg(tv?.basic_eps_net_income)}">${fmtNum(tv?.basic_eps_net_income,2)}</td>
        <td class="tv-col">${tv?.earnings_next_date ? fmtDate(tv.earnings_next_date) : '—'}</td>
        <td class="tv-col tv-num${posNeg(tv?.ebitda_yoy_growth_fy)}">${tv?.ebitda_yoy_growth_fy != null ? fmtNum(tv.ebitda_yoy_growth_fy,1)+'%' : '—'}</td>
        <td class="tv-col tv-num">${fmtMCap(tv?.ebitda)}</td>
        <td class="tv-col tv-num${posNeg(tv?.gross_margin)}">${tv?.gross_margin != null ? fmtNum(tv.gross_margin,1)+'%' : '—'}</td>
        <td class="tv-col tv-num${posNeg(tv?.gross_profit_yoy_growth_fy)}">${tv?.gross_profit_yoy_growth_fy != null ? fmtNum(tv.gross_profit_yoy_growth_fy,1)+'%' : '—'}</td>
        <td class="tv-col tv-num${posNeg(tv?.mom_1m)}">${fmtNum(tv?.mom_1m,2)}</td>
        <td class="tv-col tv-num">${fmtNum(tv?.volatility,1)}</td>
        <td class="tv-col tv-num">${fmtNum(tv?.beta,2)}</td>
        <td class="tv-col tv-num">${fmtNum(tv?.beta_3_year,2)}</td>
        <td class="tv-col tv-num">${fmtMCap(tv?.avg_vol_10d)}</td>
        <td class="tv-col tv-num">${fmtMCap(tv?.average_volume_30d_calc)}</td>
        <td class="tv-col tv-num tv-rating-txt--${tvRatingClass(tv?.recommend_all_1m)}">${fmtNum(tv?.recommend_all_1m,2)}</td>

        <td class="col-name">${c.name}</td>
        <td class="col-links"><div class="link-cluster">

            ? `<a href="${links.tradingview}" class="link-chip link-chip--tv" target="_blank" title="TradingView"><img src="${TV_LOGO}" class="link-logo" alt="TV" loading="lazy"></a>`
            : `<span class="link-chip link-chip--missing"><img src="${TV_LOGO}" class="link-logo" alt="TV" loading="lazy"></span>`}
          ${links.stocktwits
            ? `<a href="${links.stocktwits}" class="link-chip link-chip--st" target="_blank" title="StockTwits"><img src="${ST_LOGO}" class="link-logo" alt="ST" loading="lazy"></a>`
            : `<span class="link-chip link-chip--missing"><img src="${ST_LOGO}" class="link-logo" alt="ST" loading="lazy"></span>`}
          ${links.yahoo
            ? `<a href="${links.yahoo}" class="link-chip link-chip--yahoo" target="_blank" title="Yahoo Finance"><img src="${YH_LOGO}" class="link-logo" alt="Y!" loading="lazy"></a>`
            : `<span class="link-chip link-chip--missing"><img src="${YH_LOGO}" class="link-logo" alt="Y!" loading="lazy"></span>`}
        </div></td>
        <td class="col-signal"><span class="signal-text">${c.sources[c.sources.length-1]?.info_snippet ?? ''}</span></td>

    }
    return `<tr class="candidate-row state-${c.workspace_state}${c.id === activeId ? ' active-row' : ''}${selectedIds.has(c.id) ? ' selected' : ''}" data-id="${c.id}">

function renderDetail(c) {
  const panel = document.getElementById('detail-panel');
  panel.className = 'detail-drawer open';
  const tv = c.tv_data;
  const links = c.links ?? {};
  const stateMap = { new:'Neu', reviewed:'Gesehen', promoted:'Promoted', dismissed:'Abgelehnt', imported:'Importiert' };

  const tvSection = tv ? `
    <div class="detail-section">
      <h3>TV Daten</h3>
      ${tv.description ? `<p style="margin-bottom:8px;font-size:13px;color:var(--text)">${tv.description}</p>` : ''}
      ${c.sub_sector ? `<p style="margin-bottom:10px;font-size:12px;color:var(--text-muted)">${c.sub_sector}${c.sector ? ' · '+c.sector : ''}</p>` : ''}
      <div class="tv-data-grid">
        <div class="tv-kv"><span>Rating</span><strong class="tv-rating tv-rating--${tvRatingClass(tv.rating)}">${tvRatingLabelFull(tv.rating)}${tv.rating != null ? ` (${tv.rating.toFixed(2)})` : ''}</strong></div>
        <div class="tv-kv"><span>Market Cap</span><strong>${fmtMCap(tv.market_cap)}</strong></div>
        <div class="tv-kv"><span>Kurs</span><strong>${tv.close != null ? tv.close.toLocaleString('de-DE', {minimumFractionDigits:2,maximumFractionDigits:2}) : '—'}</strong></div>
        <div class="tv-kv"><span>KGV (TTM)</span><strong>${tv.pe_ttm != null ? tv.pe_ttm.toFixed(1) : '—'}</strong></div>
        <div class="tv-kv"><span>Dividende</span><strong>${tv.dividend_yield != null ? tv.dividend_yield.toFixed(2)+'%' : '—'}</strong></div>
        <div class="tv-kv"><span>Nächste Earnings</span><strong>${tv.earnings_next_date ? fmtDate(tv.earnings_next_date) : '—'}</strong></div>
        <div class="tv-kv"><span>RSI</span><strong>${tv.rsi != null ? tv.rsi.toFixed(1) : '—'}</strong></div>
        <div class="tv-kv"><span>Beta</span><strong>${tv.beta != null ? tv.beta.toFixed(2) : '—'}</strong></div>
      </div>
      ${c.sector ? `<div class="tv-meta"><span class="tag">${c.sector}</span>${c.sub_sector ? `<span class="tag">${c.sub_sector}</span>` : ''}</div>` : ''}
      <small class="tv-fetched">Stand: ${fmtDateTime(tv.fetched_at)}</small>
    </div>` : '';

  const enrichSection = c.enrichment ? (() => {
    const e = c.enrichment;
    const confColor = { high: '#2ecc71', medium: '#f39c12', low: '#e74c3c' }[e.confidence] ?? '#999';
    return `<div class="enrichment-result">
      <div class="enrichment-meta">
        <span class="badge" style="background:#6c3483;color:#fff">${e.model}</span>
        <span style="font-size:11px;color:${confColor};font-weight:600">${e.confidence} confidence</span>
        <small>${fmtDateTime(e.enriched_at)}</small>
      </div>
      <div class="enrichment-tags">
        ${e.sector ? `<span class="tag">${e.sector}</span>` : ''}
        ${e.industry ? `<span class="tag">${e.industry}</span>` : ''}
        ${e.market_cap_bucket ? `<span class="tag">${e.market_cap_bucket} cap</span>` : ''}
        ${e.region ? `<span class="tag">${e.region}</span>` : ''}
      </div>
      <div class="enrichment-thesis">
        <p><strong>These:</strong> ${e.thesis_short ?? ''}</p>
        ${e.thesis_long ? `<details><summary>Ausführliche These</summary><div class="thesis-long">${e.thesis_long}</div></details>` : ''}
      </div>
      ${e.risks?.length ? `<div class="enrichment-section"><strong>Risiken:</strong><ul>${e.risks.map(r=>`<li>${r}</li>`).join('')}</ul></div>` : ''}
      ${e.catalysts?.length ? `<div class="enrichment-section"><strong>Katalysatoren:</strong><ul>${e.catalysts.map(r=>`<li>${r}</li>`).join('')}</ul></div>` : ''}
      ${e.sentiment ? `<div class="enrichment-section"><strong>Sentiment:</strong> <span class="tag">${e.sentiment}</span></div>` : ''}
    </div>`;
  })() : `<p class="no-enrichment">Noch kein Enrichment vorhanden.</p>`;

  const sourcesHtml = c.sources.map((s, i) => `
    <details class="source-item" ${i===0?'open':''}>
      <summary>
        <span class="source-adapter">${s.adapter}</span>
        <span class="source-signal">${s.signal_type}</span>
        <small>${fmtDateTime(s.discovered_at)}</small>
      </summary>
      <div class="source-body">
        <p class="source-snippet">${s.info_snippet ?? ''}</p>
        <a href="${s.source_url}" target="_blank" rel="noopener">Quelle öffnen ↗</a>
        <details class="raw-signal">
          <summary>Raw Signal</summary>
          <pre>${JSON.stringify(s.raw_signal ?? {}, null, 2)}</pre>
        </details>
      </div>
    </details>`).join('');

  function linkBtn(href, logo, label, cls) {
    if (href) return `<a href="${href}" target="_blank" rel="noopener" class="link-btn ${cls}"><img src="${logo}" class="link-btn-logo" alt=""> ${label} ↗</a>`;
    return `<span class="link-btn ${cls} link-btn--missing"><img src="${logo}" class="link-btn-logo" alt=""> ${label}</span>`;
  }

  panel.innerHTML = `
    <div class="detail-header">
      <div class="detail-title">
        <h2>${c.symbol} <span class="exchange-label">${c.exchange}</span></h2>
        <p class="detail-name">${tv?.description ?? c.name}</p>
        ${c.isin ? `<small class="isin">ISIN: ${c.isin}</small>` : ''}
      </div>
      <button class="btn-icon" id="detail-close">✕</button>
    </div>
    <div class="detail-state">
      Status: <strong>${stateMap[c.workspace_state] ?? c.workspace_state}</strong>&nbsp;
      ${!['promoted','imported'].includes(c.workspace_state) ? `<button class="btn btn-sm btn-success">✓ Promoten</button>` : ''}
      ${c.workspace_state !== 'dismissed' ? `<button class="btn btn-sm btn-danger">✗ Ablehnen</button>` : ''}
      ${c.workspace_state === 'new' ? `<button class="btn btn-sm">👁 Als gesehen markieren</button>` : ''}
    </div>
    ${tvSection}
    <div class="detail-section">
      <h3>Quellen (${c.sources.length})</h3>
      ${sourcesHtml}
    </div>
    <div class="detail-section">
      <h3>Links</h3>
      <div class="detail-links-btns">
        ${linkBtn(links.tradingview, TV_LOGO, 'TradingView', 'link-tv')}
        ${linkBtn(links.stocktwits, ST_LOGO, 'StockTwits', 'link-st')}
        ${linkBtn(links.yahoo, YH_LOGO, 'Yahoo Finance', 'link-yahoo')}
      </div>
    </div>
    <div class="detail-section">
      <h3>Notizen</h3>
      <textarea class="notes-editor" rows="3" placeholder="Notizen…">${c.notes ?? ''}</textarea>
      <button class="btn btn-sm btn-secondary">Speichern</button>
    </div>
    <div class="detail-section">
      <h3>AI-Enrichment</h3>
      ${enrichSection}
      <button class="btn btn-sm btn-ai">${c.enrichment ? '🔄 Neu enrichen' : '✨ AI-Enrichment ausführen'}</button>
    </div>`;

  panel.querySelector('#detail-close').addEventListener('click', () => {
    panel.className = 'detail-drawer';
    activeId = null;
    refreshTable();
  });
}

function refreshTable() {
  const thead = document.getElementById('candidate-thead');
  const tbody = document.getElementById('candidate-tbody');
  const bulkBar = document.getElementById('bulk-bar');
  const bulkCount = document.getElementById('bulk-count');
  if (!thead) return;
  thead.innerHTML = renderThead();
  tbody.innerHTML = renderRows();
  thead.querySelectorAll('.th-sort[data-sort]').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      const col = el.dataset.sort;
      if (sortCol === col) sortDir = sortDir === 'asc' ? 'desc' : 'asc';
      else { sortCol = col; sortDir = col === 'discovered' ? 'desc' : 'asc'; }
      refreshTable();
    });
  });
  tbody.querySelectorAll('.candidate-row').forEach(tr => {
    tr.addEventListener('click', e => {
      if (['INPUT','BUTTON','A'].includes(e.target.tagName)) return;
      const id = tr.dataset.id;
      activeId = id;
      refreshTable();
      const c = MOCK.find(x => x.id === id);
      if (c) renderDetail(c);
    });
  });
  tbody.querySelectorAll('.row-check').forEach(cb => {
    cb.addEventListener('change', e => {
      const id = e.target.dataset.id;
      if (e.target.checked) selectedIds.add(id); else selectedIds.delete(id);
      const row = tbody.querySelector(`tr[data-id="${id}"]`);
      if (row) row.classList.toggle('selected', e.target.checked);
      updateBulkBar();
    });
  });
  tbody.querySelectorAll('[data-action="promote"]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const c = MOCK.find(x => x.id === btn.dataset.id);
      if (c) { c.workspace_state = 'promoted'; refreshTable(); if (activeId === c.id) renderDetail(c); }
    });
  });
  tbody.querySelectorAll('[data-action="dismiss"]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const c = MOCK.find(x => x.id === btn.dataset.id);
      if (c) { c.workspace_state = 'dismissed'; refreshTable(); if (activeId === c.id) renderDetail(c); }
    });
  });
  const selectAll = thead.querySelector('#select-all');
  if (selectAll) {
    selectAll.addEventListener('change', e => {
      const rows = getRows();
      if (e.target.checked) rows.forEach(c => selectedIds.add(c.id));
      else selectedIds.clear();
      refreshTable();
    });
    selectAll.checked = getRows().length > 0 && getRows().every(c => selectedIds.has(c.id));
  }
  updateBulkBar();
}

function updateBulkBar() {
  const bulkBar = document.getElementById('bulk-bar');
  const bulkCount = document.getElementById('bulk-count');
  if (!bulkBar) return;
  if (selectedIds.size === 0) { bulkBar.style.display = 'none'; return; }
  bulkBar.style.display = 'flex';
  bulkCount.textContent = `${selectedIds.size} ausgewählt`;
}

function renderListPanel() {
  const sectors = [...new Set(MOCK.filter(c => c.sector).map(c => c.sector))].sort();
  document.getElementById('list-panel').innerHTML = `
    <div class="filter-bar">
      <div class="filter-group">
        <label>Ansicht</label>
        <div class="blob-switch" id="blob-switch">
          <button class="blob-btn ${blobTab==='inbox'?'active':''}" data-blob="inbox">Inbox</button>
          <button class="blob-btn ${blobTab==='archive'?'active':''}" data-blob="archive">Archiv</button>
          <button class="blob-btn ${blobTab==='export'?'active':''}" data-blob="export">Export</button>
        </div>
      </div>
      <div class="filter-group">
        <label>Spalten</label>
        <div class="view-switch" id="view-switch">
          <button class="view-btn ${viewMode==='standard'?'active':''}" data-view="standard">Standard</button>
          <button class="view-btn ${viewMode==='technicals'?'active':''}" data-view="technicals">Technicals</button>
          <button class="view-btn ${viewMode==='fundamentals'?'active':''}" data-view="fundamentals">Fundamentals</button>
        </div>
      </div>
      <div class="filter-group">
        <label>Status</label>
        <select id="filter-state">
          <option value="">Alle</option>
          <option value="new" ${filterState==='new'?'selected':''}>Neu</option>
          <option value="reviewed" ${filterState==='reviewed'?'selected':''}>Gesehen</option>
          <option value="promoted" ${filterState==='promoted'?'selected':''}>Promoted</option>
          <option value="dismissed" ${filterState==='dismissed'?'selected':''}>Abgelehnt</option>
        </select>
      </div>
      <div class="filter-group">
        <label>Sektor</label>
        <select id="filter-sector">
          <option value="">Alle Sektoren</option>
          ${sectors.map(s => `<option value="${s}" ${filterSector===s?'selected':''}>${s}</option>`).join('')}
        </select>
      </div>
      <div class="filter-group">
        <label>Marktkapitalisierung</label>
        <select id="filter-capsize">
          <option value="">Alle</option>
          <option value="micro" ${filterCapSize==='micro'?'selected':''}>Micro (&lt;300M)</option>
          <option value="small" ${filterCapSize==='small'?'selected':''}>Small (300M–2B)</option>
          <option value="mid" ${filterCapSize==='mid'?'selected':''}>Mid (2–50B)</option>
          <option value="large" ${filterCapSize==='large'?'selected':''}>Large (&gt;50B)</option>
        </select>
      </div>
    </div>

    <div class="bulk-bar" id="bulk-bar" style="display:none">
      <span id="bulk-count">0 ausgewählt</span>
      <button class="btn btn-sm btn-danger">${IC.xMark} Ablehnen</button>
      <button class="btn btn-sm btn-success">${IC.check} Promoten</button>
      <button class="btn btn-sm btn-ai">${IC.sparkles} Enrich</button>
      <button class="btn btn-sm btn-tv">${IC.barChart} TV Daten</button>
      <button class="btn btn-sm btn-danger">${IC.trash} Löschen</button>
      <button class="btn btn-sm" id="bulk-clear">Auswahl leeren</button>
    </div>

    <div class="table-wrapper">
      <table class="candidate-table">
        <thead id="candidate-thead"></thead>
        <tbody id="candidate-tbody"></tbody>
      </table>
    </div>`;

  document.querySelectorAll('.blob-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      blobTab = btn.dataset.blob;
      document.querySelectorAll('.blob-btn').forEach(b => b.classList.toggle('active', b.dataset.blob === blobTab));
    });
  });
  document.querySelectorAll('.view-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      viewMode = btn.dataset.view;
      sortCol = viewMode === 'standard' ? 'discovered' : 'tv_mcap';
      sortDir = 'desc';
      document.querySelectorAll('.view-btn').forEach(b => b.classList.toggle('active', b.dataset.view === viewMode));
      refreshTable();
    });
  });
  document.getElementById('filter-state').addEventListener('change', e => { filterState = e.target.value; selectedIds.clear(); refreshTable(); });
  document.getElementById('filter-sector').addEventListener('change', e => { filterSector = e.target.value; selectedIds.clear(); refreshTable(); });
  document.getElementById('filter-capsize').addEventListener('change', e => { filterCapSize = e.target.value; selectedIds.clear(); refreshTable(); });
  document.getElementById('bulk-clear').addEventListener('click', () => { selectedIds.clear(); refreshTable(); });

  refreshTable();
}

// ── Boot ──────────────────────────────────────────────────────────────────────
renderListPanel();

// Open NVDA detail by default
activeId = '1';
refreshTable();
renderDetail(MOCK[0]);
</script>
